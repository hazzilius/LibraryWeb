<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — Электронная библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{../includes/header}"></div>

<div class="container">
    <h1 class="text-center"> Регистрация </h1>
    <form th:action="@{/saveUser}" th:object="${user}" method="post">
        <h6>Информация для входа</h6>
        <div class="card">
            <div class="card-body">
                <label for="username" class="form-label">Логин: </label>
                <input required type="text" class="form-control" id="username" th:field="*{username}"/>
                <label for="password" class="form-label">Пароль: </label>
                <input required type="password" class="form-control" id="password" th:field="*{password}"/>
            </div>
        </div>
        <br>
        <h6>Контактная информация</h6>
        <div class="card">
            <div class="card-body">
                <label for="name" class="form-label">Имя: </label>
                <input required type="text" class="form-control" id="name" th:field="*{name}"/>

                <label for="email" class="form-label">E-mail: </label>
                <input required type="email" class="form-control" id="email" th:field="*{email}"/>

                <label for="phone" class="form-label">Телефон (Необязательно): </label>
                <input type="text" class="form-control" id="phone" th:field="*{phone}"/>
            </div>
        </div>

        <br>
        <button class="btn btn-primary" type="submit">Регистрация</button>
    </form>
</div>
</body>
</html>
