<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Авторизация — Электронная библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{../includes/header}"></div>

<div class="container">
    <h1 class="text-center"> Авторизация </h1>
    <div th:if="${param.error}" class="alert alert-danger">
        Неправильный логин или пароль!
    </div>
    <div th:if="${param.logout}" class="alert alert-primary">
        Вы успешно вышли из аккаунта!
    </div>
    <div th:if="${param.reg}" class="alert alert-primary">
        Вы успешно зарегистрировались!
    </div>
    <form th:action="@{/login}" method=POST>
        <div class="card">
            <div class="card-body">
                <label for="username" class="form-label">Логин: </label>
                <input type="text" class="form-control" id="username" name="username"/>
                <label for="password" class="form-label">Пароль: </label>
                <input type="password" class="form-control" id="password" name="password"/>
            </div>
        </div>
        <br>
        <button class="btn btn-primary" type="submit">Авторизация</button>
    </form>
</div>
</body>
</html>
