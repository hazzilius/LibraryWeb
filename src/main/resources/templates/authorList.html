<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>[[${pageTitle}]] — Электронная библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{../includes/header}"></div>

<div class="container">
    <h1 class="text-center"> [[${pageTitle}]] </h1>
    <hr>
    <form th:action="@{/author}" method=GET>
        <div th:replace="~{../includes/searchbar}"></div>
    </form>
    <br>
    <div th:if="${authors.isEmpty()}" class="alert alert-danger">
        Ничего не найдено!
    </div>
    <div class="card" th:if="${!authors.isEmpty()}">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="thead-light">
                <th>Имя</th>
                </thead>
                <tr th:each="author : ${authors}">
                    <td>
                        <a th:href="@{/author/{id}(id=${author.id})}" th:text="${author.name}" class="link-dark">Автор</a>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
</body>
</html>
