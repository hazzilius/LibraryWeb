<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>[[${author.name}]] — Электронная библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{../includes/header}"></div>

<div class="container">
    <h1 class="text-center"> Редактирование автора "[[${author.name}]]" </h1>
    <hr>
    <div class="card bg-light">
        <div class="card-body">
            <form th:action="@{/admin/editAuthor/{id}(id = ${author.id})}" th:object="${author}" method="post">
                <label for="name" class="form-label">Имя: </label>
                <input required th:value="${author.name}" type="text" class="form-control" id="name" th:field="*{name}"/>

                <label for="bio" class="form-label">Биография: </label>
                <input required th:value="${author.bio}" type="text" class="form-control" id="bio" th:field="*{bio}"/>

                <br>
                <button class="btn btn-primary" type="submit">Сохранить</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
