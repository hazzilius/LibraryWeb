<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>[[${bookObject.title}]] — Электронная библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{../includes/header}"></div>

<div class="container">
    <h1 class="text-center"> Редактирование книги "[[${bookObject.title}]]" </h1>
    <hr>
    <div class="card bg-light">
        <div class="card-body">
            <form th:action="@{/admin/editBook/{id}(id = ${bookObject.id})}" th:object="${bookObject}" method="post">
                <label for="title" class="form-label">Название: </label>
                <input required th:value="${bookObject.title}" type="text" class="form-control" id="title" th:field="*{title}"/>

                <label for="author" class="form-label">Автор: </label>
                <select class="form-control" id="author" th:field="*{author}">
                    <option th:each="author : ${authors}" th:value="${author.id}" th:text="${author.name}">Опция</option>
                </select>

                <label for="isbn" class="form-label">ISBN: </label>
                <input type="text" th:value="${bookObject.isbn}" class="form-control" id="isbn" th:field="*{isbn}"/>

                <label for="year" class="form-label">Год: </label>
                <input type="text" th:value="${bookObject.year}" class="form-control" id="year" th:field="*{year}"/>

                <br>
                <button class="btn btn-primary" type="submit">Сохранить</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
