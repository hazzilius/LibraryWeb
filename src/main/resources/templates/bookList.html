<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>[[${pageTitle}]] — Электронная библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{../includes/header}"></div>

<div class="container">
    <h1 class="text-center"> [[${pageTitle}]] </h1>
    <hr>
    <form th:action="@{/book}" method=GET>
        <div class="d-inline-flex w-100">
            <label for="search"></label>
            <input type="text" class="form-control" id="search" name="search" placeholder="Поиск" th:value="${search}"/>
            <button type="submit" class="btn btn-primary">Найти</button>
        </div>
    </form>
    <br>
    <div class="card">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="thead-light">
                <th>Название</th>
                <th>Автор</th>
                </thead>
                <tr th:each="book : ${books}">
                    <td>
                        <a th:href="@{/book/{id}(id=${book.id})}" class="link-dark">[[${book.title}]], [[${book.year}]]</a>
                    </td>
                    <td>
                        <a th:href="@{/author/{id}(id=${book.author.id})}" th:text="${book.author.name}" class="link-dark">Автор</a>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>
</body>
</html>
