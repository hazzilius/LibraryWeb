<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Список книг — Электронная библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{../includes/header}"></div>

<div class="container">
    <h1 class="text-center"> Список книг </h1>
    <hr>
    <table class="table">
        <thead class="thead-light">
            <td>Название</td>
            <td>Автор</td>
            <td>Год</td>
        </thead>
        <tr th:each="book : ${books}">
                <td>
                    <a th:href="@{/book/{id}(id=${book.id})}" th:text="${book.title}">Название</a>
                </td>
                <td th:text="${book.author.name}">
                    Автор
                </td>
                <td th:text="${book.year}">
                    Год
                </td>
        </tr>
    </table>
</div>
</body>
</html>
