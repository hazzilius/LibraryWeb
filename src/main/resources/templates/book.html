<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org/" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>[[${book.title}]] — Электронная библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{../includes/header}"></div>

<div class="container">
    <h1 class="text-center">Информация о книге</h1>
    <hr>
    <div class="card">
        <div class="card-body">
            <h4 class="card-text">[[${book.title}]], [[${book.year}]]</h4>

            <hr>

            <h6 class="card-text"><a th:href="@{/author/{id}(id = ${book.author.id})}" class="link-dark">[[${book.author.name}]]</a></h6>
            <h6 class="card-text" th:text="${book.isbn}">ISBN</h6>
        </div>
    </div>

    <br>

    <div sec:authorize="hasAuthority('ADMIN')">
        <div class="btn-group mr-2" role="group">
            <form method="get" th:action="@{/admin/edit/book/{id}(id=${book.id})}">
                <button class="btn btn-primary" type="submit">Редактировать</button>
            </form>
        </div>
        <div class="btn-group" role="group">
            <form method="post" th:action="@{/admin/deleteBook/{id}(id=${book.id})}">
                <button class="btn btn-danger" type="submit">Удалить</button>
            </form>
        </div>
    </div>

    <br sec:authorize="hasAuthority('ADMIN')">

    <div class="card">
        <div class="card-body">
            <h4 class="card-text">Комментарии</h4>
            <hr>
            <form th:action="@{/addReview/{id}(id = ${book.id})}" th:object="${review}" method="post">
                <label for="text" class="form-label">Комментарий: </label>
                <textarea required type="text" class="form-control" id="text" th:field="*{text}"></textarea>

                <br>
                <button class="btn btn-primary" type="submit">Отправить</button>
            </form>
            <hr>
            <div th:each="review : ${reviews}">
                <div>
                    <h5 class="card-text">[[${review.user.name}]]</h5>
                    <h6 class="card-text">[[${review.date}]]</h6>
                    <form th:if="${#authorization.expression('hasAuthority(''ADMIN'')') || user.id == review.user.id}" method="post" th:action="@{/deleteReview/{bookId}/{id}(id = ${review.id}, bookId = ${book.id})}" >
                        <button type="submit" class="btn btn-danger">Удалить</button>
                    </form>
                </div>
                <p class="card-text">[[${review.text}]]</p>
                <hr>
            </div>
        </div>
    </div>
</div>
</body>
</html>
