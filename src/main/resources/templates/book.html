<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>[[${book.title}]] — Электронная библиотека</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{../includes/header}"></div>

<div class="container">
    <h1 class="text-center">Информация о книге</h1>
    <hr>
    <div class="card">
        <div class="card-body">
            <h4 class="card-text" th:text="${book.title}">Название</h4>
            <h6 class="card-text">[[${book.author.name}]], [[${book.year}]]</h6>
            <br>
            <h6 class="card-text" th:text="${book.isbn}">ISBN</h6>
        </div>
    </div>
    <a class="btn btn-primary" th:href="@{/deleteBook/{id}(id=${book.id})}">Удалить</a>
</div>
</body>
</html>
